<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">

  {% seo %}
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <div class="nav-wrapper">
        <a href="{{ '/' | relative_url }}" class="logo">
          <span class="logo-mark"></span>
          <span class="logo-text">Technickly Labs</span>
        </a>

        <div class="nav-links">
          <a href="{{ '/' | relative_url }}" class="nav-link">Home</a>
          <a href="{{ '/projects/' | relative_url }}" class="nav-link">Projects</a>
          <a href="{{ '/about/' | relative_url }}" class="nav-link">About</a>
        </div>
      </div>
    </div>
  </nav>

  <main class="main-content">
    {{ content }}
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer-content">
        <div class="footer-section">
          <div class="footer-logo">
            <span class="logo-mark"></span>
            <span class="logo-text">Technickly Labs</span>
          </div>
          <p class="footer-description">
            Project notes, build logs, and docs for Opsis and RoleSmith.
          </p>
        </div>

        <div class="footer-section">
          <h4>Navigation</h4>
          <ul>
            <li><a href="{{ '/' | relative_url }}">Home</a></li>
            <li><a href="{{ '/projects/' | relative_url }}">Projects</a></li>
            <li><a href="{{ '/about/' | relative_url }}">About</a></li>
          </ul>
        </div>

        <div class="footer-section">
          <h4>Projects</h4>
          <ul>
            <li><a href="{{ '/projects/opsis/' | relative_url }}">Opsis</a></li>
            <li><a href="{{ '/projects/rolesmith/' | relative_url }}">RoleSmith</a></li>
          </ul>
        </div>

        <div class="footer-section">
          <h4>Links</h4>
          <ul>
            <li><a href="mailto:technickly@gmail.com">Email</a></li>
            <li><a href="https://github.com/yourusername">GitHub</a></li>
          </ul>
        </div>
      </div>

      <div class="footer-bottom">
        <p>&copy; 2026 Technickly AI.</p>
      </div>
    </div>
  </footer>
</body>
</html>
